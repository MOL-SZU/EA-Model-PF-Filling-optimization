[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-model-pf-filling"
version = "0.1.0"
description = "Two-stage PlatEMO and MLP framework for Pareto-front hole filling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0,<2.6",
    "pymoo>=0.6",
]

[project.optional-dependencies]
matlab = ["matlabengine>=24.1"]
test = ["pytest>=8"]

[project.scripts]
ea-model = "ea_model.cli:main"

[tool.setuptools]
packages = ["ea_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "matlab: requires MATLAB, matlab.engine, and PlatEMO",
]
